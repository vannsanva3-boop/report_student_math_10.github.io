<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចូលប្រើប្រាស់ប្រព័ន្ធ (Login)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Kantumruy Pro', sans-serif; } 
    .font-moul { font-family: 'Moul', cursive; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

  <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-sm sm:max-w-md p-6 sm:p-8 space-y-5">
    
    <div class="text-center space-y-1.5">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-700 text-white text-2xl shadow-md mb-1">
        🏫
      </div>
      <h2 class="font-moul text-xs sm:text-sm text-slate-800">ព្រះរាជាណាចក្រកម្ពុជា</h2>
      <h3 class="font-moul text-[11px] text-slate-700">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
      <div class="pt-1">
        <h1 class="text-base sm:text-lg font-bold text-indigo-900 leading-snug">ប្រព័ន្ធគ្រប់គ្រងពិន្ទុគណិតវិទ្យា ថ្នាក់ទី ១០</h1>
        <p class="text-[11px] text-slate-500">សូមបញ្ចូល Username និង Password</p>
      </div>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-600 text-xs px-3.5 py-2 rounded-xl flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ឈ្មោះអ្នកប្រើ (Username)</label>
        <div class="relative">
          <input type="text" name="username" required autofocus placeholder="admin"
                 class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          <span class="absolute left-3 top-2.5 text-slate-400">👤</span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ពាក្យសម្ងាត់ (Password)</label>
        <div class="relative">
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          <span class="absolute left-3 top-2.5 text-slate-400">🔒</span>
        </div>
      </div>

      <button type="submit" 
              class="w-full py-3 bg-indigo-700 text-white font-bold rounded-xl shadow-md hover:bg-indigo-800 transition duration-200 flex items-center justify-center gap-2 text-sm">
        <span>ចូលប្រើប្រាស់ (Login)</span>
        <span>➔</span>
      </button>
    </form>

    <div class="bg-indigo-50/70 rounded-xl p-2.5 border border-indigo-100 text-center space-y-0.5">
      <p class="text-[10px] font-bold text-indigo-900 uppercase">🔑 គណនីគ្រូបន្ទុកថ្នាក់</p>
      <p class="text-xs text-indigo-700">Username: <strong class="text-indigo-950 font-mono">#####</strong> &nbsp;|&nbsp; Password: <strong class="text-indigo-950 font-mono">***</strong></p>
    </div>

  </div>

</body>
</html>
